[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proton-backup"
version = "0.2.0"
description = "Backup and sync manager for Proton Drive CLI with Textual TUI and scheduler"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ryan Cohn" }
]
dependencies = [
    "textual>=0.70.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "pydantic>=2.5.0",
]

[project.scripts]
proton-backup = "proton_backup.cli:main"
pdbkp = "proton_backup.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/proton_backup"]
